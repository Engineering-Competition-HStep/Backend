spring.application.name=Hstep

# .env
spring.config.import=file:C:/Hstep/Hstep/.env[.properties]

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# CRAWLER
app.notice-crawler.enabled=${NOTICE_CRAWLER_ENABLED:true}
app.notice-crawler.run-on-startup=${NOTICE_CRAWLER_RUN_ON_STARTUP:true}
app.notice-crawler.cron=${NOTICE_CRAWLER_CRON:0 */30 * * * *}
app.notice-crawler.scheduled-pages=${NOTICE_CRAWLER_SCHEDULED_PAGES:2}
app.notice-crawler.max-manual-pages=${NOTICE_CRAWLER_MAX_MANUAL_PAGES:50}
app.notice-crawler.timeout-ms=${NOTICE_CRAWLER_TIMEOUT_MS:30000}
app.notice-crawler.delay-ms=${NOTICE_CRAWLER_DELAY_MS:1000}
app.notice-crawler.user-agent=${NOTICE_CRAWLER_USER_AGENT:Mozilla/5.0 HStepNoticeCrawler/1.0}

# Gemini
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=${GEMINI_TEMPERATURE:0.1}
spring.ai.google.genai.chat.response-mime-type=application/json