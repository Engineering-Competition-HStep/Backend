spring.datasource.url=jdbc:mysql://localhost:3306/hstep
spring.datasource.username=root
spring.datasource.password=your_local_mysql_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 이메일 인증 SMTP 설정 (예: Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.email-verification.from=your_email@gmail.com
app.email-verification.verify-base-url=http://localhost:8080
app.email-verification.expiration-minutes=15

# 서버 실행 시 JOB별 AI 표준 로드맵의 누락 항목을 자동으로 보완합니다.
app.ai-roadmap-standard-seed.enabled=true

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.1
spring.ai.google.genai.chat.response-mime-type=application/json

app.jwt.secret=change-this-to-a-random-32-character-or-longer-string
app.jwt.access-token-expiration-ms=3600000
