spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hstep
    username: root
    password: your_local_mysql_password # 각자 작성
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-2.5-flash
          temperature: 0.1

app:
  jwt:
    secret: change-this-to-a-random-32-character-or-longer-string # 각자 작성
    access-token-expiration-ms: 3600000
